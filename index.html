<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Abid Hussain Punjoo | S.A.S. Pakistan</title>

    <style>
        :root {
            --navy: #0b1f3a;
            --navy-light: #16365f;
            --blue: #2563eb;
            --gold: #c8a951;
            --gold-light: #e4cf86;
            --white: #ffffff;
            --off-white: #f8fafc;
            --text: #172033;
            --muted: #64748b;
            --border: #e5e7eb;
            --whatsapp: #25d366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #dbeafe 0,
                    #f1f5f9 40%,
                    #e2e8f0 100%
                );

            color: var(--text);
        }

        /* CARD */

        .business-card {
            width: 100%;
            max-width: 430px;
            background: var(--white);

            border-radius: 24px;

            overflow: hidden;

            box-shadow:
                0 25px 60px rgba(15, 23, 42, 0.16),
                0 4px 12px rgba(15, 23, 42, 0.05);
        }

        /* HEADER */

        .card-header {
            position: relative;

            padding: 38px 28px 32px;

            text-align: center;

            color: white;

            background:
                linear-gradient(
                    145deg,
                    var(--navy) 0%,
                    var(--navy-light) 100%
                );

            overflow: hidden;
        }

        .card-header::before {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 50%;

            top: -110px;
            right: -70px;
        }

        .card-header::after {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            border: 1px solid rgba(200,169,81,0.16);
            border-radius: 50%;

            bottom: -120px;
            left: -70px;
        }

        .brand-mark {
            position: relative;
            z-index: 2;

            width: 62px;
            height: 62px;

            margin: 0 auto 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            border: 1px solid rgba(228,207,134,0.65);
            border-radius: 50%;

            color: var(--gold-light);

            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;

            background: rgba(255,255,255,0.05);
        }

        .name {
            position: relative;
            z-index: 2;

            font-size: 27px;
            line-height: 1.2;

            font-weight: 700;

            letter-spacing: -0.4px;
        }

        .designation {
            position: relative;
            z-index: 2;

            margin-top: 8px;

            color: var(--gold-light);

            font-size: 12px;
            font-weight: 700;

            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .company {
            position: relative;
            z-index: 2;

            margin-top: 7px;

            color: rgba(255,255,255,0.82);

            font-size: 14px;
            font-weight: 500;
        }

        /* BODY */

        .card-body {
            padding: 25px;
        }

        /* PRIMARY ACTIONS */

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;

            margin-bottom: 25px;
        }

        .action {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            min-height: 52px;

            padding: 12px;

            border-radius: 12px;

            text-decoration: none;

            font-size: 14px;
            font-weight: 650;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .action:hover {
            transform: translateY(-2px);
        }

        .action svg {
            width: 19px;
            height: 19px;

            fill: currentColor;
        }

        .whatsapp {
            color: white;
            background: var(--whatsapp);

            box-shadow:
                0 5px 15px rgba(37,211,102,0.22);
        }

        .location {
            color: white;
            background: var(--navy);

            box-shadow:
                0 5px 15px rgba(11,31,58,0.18);
        }

        /* CONTACT SECTION */

        .section-title {
            margin-bottom: 10px;

            color: var(--muted);

            font-size: 10px;
            font-weight: 700;

            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .contact-list {
            border-top: 1px solid var(--border);
        }

        .contact {
            display: flex;
            align-items: center;

            min-height: 64px;

            padding: 10px 2px;

            border-bottom: 1px solid var(--border);

            color: inherit;
            text-decoration: none;
        }

        .contact:last-child {
            border-bottom: none;
        }

        .contact-icon {
            width: 40px;
            height: 40px;

            flex-shrink: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            margin-right: 13px;

            border-radius: 10px;

            background: #f1f5f9;
            color: var(--navy);
        }

        .contact-icon svg {
            width: 19px;
            height: 19px;
            fill: currentColor;
        }

        .contact-details {
            min-width: 0;
        }

        .contact-label {
            margin-bottom: 2px;

            color: var(--muted);

            font-size: 10px;
            font-weight: 600;

            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .contact-value {
            overflow: hidden;

            color: var(--text);

            font-size: 14px;
            font-weight: 550;

            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* FOOTER */

        .card-footer {
            padding: 18px 25px 22px;

            text-align: center;

            background: var(--off-white);

            border-top: 1px solid #eef2f7;
        }

        .footer-company {
            color: var(--navy);

            font-size: 11px;
            font-weight: 700;

            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .footer-line {
            width: 32px;
            height: 2px;

            margin: 9px auto;

            background: var(--gold);

            border-radius: 2px;
        }

        .footer-text {
            color: var(--muted);

            font-size: 10px;
        }

        /* MOBILE */

        @media (max-width: 380px) {
            .card-body {
                padding: 20px;
            }

            .name {
                font-size: 24px;
            }

            .action {
                font-size: 13px;
            }
        }
    </style>
</head>
